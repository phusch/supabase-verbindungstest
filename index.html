<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huschel Speicher-Test</title>
<style>
* { box-sizing: border-box; }
body { background:#f3f5f8; font-family:Arial,sans-serif; padding:20px; color:#172337; }
main { max-width:430px; margin:20px auto; }
.card { background:white; padding:20px; border-radius:14px; margin-bottom:15px; }
label { display:block; margin-top:10px; }
input,button { width:100%; padding:13px; margin:7px 0; font-size:16px; border-radius:8px; }
input { border:1px solid #ccc; }
button { background:#1769b3; color:white; border:0; cursor:pointer; }
button:disabled { opacity:.5; cursor:not-allowed; }
#status { background:#fff0cc; padding:14px; border-radius:10px; margin-bottom:15px; font-weight:bold; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; }
small { color:#64748b; }
</style>
</head>
<body>
<main>
<h2>Huschel App Speicher</h2>
<div id="status">🟡 Noch nicht angemeldet</div>
<div class="card">
<label for="key">Supabase Publishable Key</label>
<input id="key" placeholder="sb_publishable_..." autocomplete="off" spellcheck="false">
<label for="email">E-Mail</label>
<input id="email" type="email" value="huschka@eventdesign.com" autocomplete="username">
<label for="password">Passwort</label>
<input id="password" type="password" autocomplete="current-password">
<button id="login">Anmelden</button>
<button id="test" disabled>GitHub-Verbindung testen</button>
<button id="logout" disabled>Abmelden</button>
<small>Nur Publishable Key eintragen. Niemals GitHub-Token oder Supabase Secret Key verwenden. Es werden keine GitHub-Daten verändert.</small>
</div>
<div class="card"><h3>Testergebnis</h3><pre id="result">Noch kein Test.</pre></div>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const projectUrl = "https://qijordwpbwwbizfcslrv.supabase.co";
const expectedUID = "9be7d1bc-4d69-4cb8-bb42-cb2d3c705f75";
let supabase = null;
const $ = id => document.getElementById(id);
function show(text) { $("result").textContent = text; }
function state(text) { $("status").textContent = text; }
function lock(ready) {
  $("test").disabled = !ready;
  $("logout").disabled = !ready;
}
$("login").onclick = async () => {
  $("login").disabled = true;
  lock(false);
  state("🟡 Anmeldung läuft...");
  try {
    const key = $("key").value.trim();
    if (!key.startsWith("sb_publishable_")) throw new Error("Bitte Publishable Key eintragen.");
    supabase = createClient(projectUrl, key, {
      auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
    });
    const {data,error} = await supabase.auth.signInWithPassword({
      email:$("email").value.trim(), password:$("password").value
    });
    $("password").value = "";
    if (error) throw error;
    if (data.user?.id !== expectedUID) {
      await supabase.auth.signOut();
      throw new Error("Benutzer-ID stimmt nicht.");
    }
    state("🟢 Supabase-Anmeldung erfolgreich");
    show("Angemeldet. Jetzt GitHub testen.");
    lock(true);
  } catch(e) {
    $("password").value = "";
    state("🔴 Anmeldung fehlgeschlagen");
    show(e.message);
  } finally { $("login").disabled = false; }
};
$("test").onclick = async () => {
  $("test").disabled = true;
  state("🟡 GitHub wird geprüft...");
  try {
    const {data,error} = await supabase.functions.invoke("github-app-storage", {body:{}});
    if (error) {
      let details = error.message;
      if (error.context instanceof Response) {
        const response = error.context;
        details += " (HTTP " + response.status + ")";
        details += "\n" + await response.text();
      }
      throw new Error(details);
    }
    show(JSON.stringify(data,null,2));
    if (data?.ok && data?.githubConnected === true &&
        data?.private === true && data?.repository === "phusch/huschel-app-data") {
      state("🟢 GitHub-Verbindung erfolgreich");
    } else { state("🔴 GitHub-Prüfung fehlgeschlagen"); }
  } catch(e) {
    state("🔴 Verbindungstest fehlgeschlagen");
    show(e.message);
  } finally { $("test").disabled = false; }
};
$("logout").onclick = async () => {
  if (supabase) await supabase.auth.signOut();
  lock(false);
  state("🟡 Abgemeldet");
  show("Sitzung beendet.");
};
</script>
</body>
</html>
